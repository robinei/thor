[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
sysprog-core = { path = "crates/core" }
sysprog-policy = { path = "crates/policy" }
sysprog-library = { path = "crates/library" }
sysprog-ui = { path = "crates/ui" }
smithay-client-toolkit = "0.21"
fontdue = "0.9"
jiff = "0.2"
evdev = "0.13"
rusqlite = "0.40"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rustix = { version = "1", features = ["event", "fs"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "5"
resvg = { version = "0.48", default-features = false }
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }

# No panics by construction (docs/plans.md, "Rust and a project structure"): errors are values.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[workspace.lints.rust]
unsafe_code = "deny"

[package]
name = "sysprog"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sysprog-core.workspace = true
sysprog-policy.workspace = true
sysprog-library.workspace = true
sysprog-ui.workspace = true
log.workspace = true
env_logger.workspace = true

[lints]
workspace = true

[profile.release]
lto = "thin"
