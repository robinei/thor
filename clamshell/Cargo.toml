[workspace]
members = ["crates/*"]
# Built by a plain cargo build: ClamShell and the fan daemon (the system service the image installs).
default-members = [".", "crates/fan"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# (The toolchain it is built and tested with; older ones aren't tried.)
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/robinei/thor"
# (Built into the Thor's packages, not published as crates.)
publish = false

[workspace.dependencies]
clamshell-core = { path = "crates/core" }
clamshell-system = { path = "crates/system" }
clamshell-library = { path = "crates/library" }
clamshell-ui = { path = "crates/ui" }
clamshell-fan = { path = "crates/fan" }
smithay-client-toolkit = "0.21"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
fontdue = "0.9"
jiff = "0.2"
evdev = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rustix = { version = "1", features = ["event", "fs", "time", "param", "process", "net", "pipe"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
log = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
dbus = "0.9"
crc32fast = "1"
md5 = "0.8"
percent-encoding = "2"
resvg = { version = "0.48", default-features = false }
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
tempfile = "3.27"

# No panics by construction: errors are values.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[workspace.lints.rust]
unsafe_code = "deny"

# An application: its docs are read with its private items (`cargo doc --document-private-items`), so a
# public item's doc may link to a private one.
[workspace.lints.rustdoc]
private_intra_doc_links = "allow"

[package]
name = "clamshell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "ClamShell: a two-screen handheld shell for the AYN Thor (shelf, the second screen, input and power)"
default-run = "clamshell"

[dependencies]
clamshell-core.workspace = true
clamshell-system.workspace = true
clamshell-library.workspace = true
clamshell-ui.workspace = true
log.workspace = true
env_logger.workspace = true
rustix.workspace = true

[dev-dependencies]
clamshell-library = { workspace = true, features = ["demo"] }
# (The snapshot test decodes its PNGs, to hash their pixels.)
image.workspace = true

[features]
# `--snapshot` and the demo library it draws: for development, not the device's build.
dev = ["clamshell-library/demo"]

[lints]
workspace = true

[profile.release]
lto = "thin"

# For trying a change on a desktop (tools/nested-session.sh): optimised as release, without its link-time
# optimisation and in parallel pieces, incrementally, so a change builds in seconds.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 256
incremental = true

# Dependencies optimised in dev and test builds too (built once, then cached): drawing and PNG encoding
# (tiny-skia, png, fontdue) are most of what the snapshot test and a debug ClamShell spend their time in.
[profile.dev.package."*"]
opt-level = 3
