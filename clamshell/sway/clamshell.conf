# How a ClamShell session behaves under sway, included by each machine's config (the device's, the
# virtual Thor's, the nested test's), which adds its outputs and inputs and starts ClamShell. sway's
# default config, with its key bindings and bar, is never read: a machine's config replaces it.
# What depends on the running machine (our workspaces pinned to the main screen, the second screen's
# workspace, where shelf's and Steam's windows go) ClamShell asks of sway when it connects.

# No borders, on tiled windows or floating ones.
default_border none
default_floating_border none

# Focus never follows the pointer (the pad mouse crossing to the second screen mustn't take the keyboard
# from a game), nor the pointer focus.
focus_follows_mouse no
mouse_warping none

# A screen shows one window at a time: workspaces are tabs, with no tab bar over a lone window (the
# --i3 behaviour of hide_edge_borders; there are no borders for it to hide otherwise).
workspace_layout tabbed
hide_edge_borders --i3 smart

# The tabs in ClamShell's look: black, its font, the title centred, the tab shown in its bright text and
# the others grey, no lines. Colours: border, background, text, indicator, child border.
font pango:Noto Sans 11
title_align center
titlebar_border_thickness 0
titlebar_padding 8 4
client.focused          #000000 #000000 #c8c8d0 #000000 #000000
client.focused_inactive #000000 #000000 #c8c8d0 #000000 #000000
client.unfocused        #000000 #000000 #5a5a64 #000000 #000000
client.urgent           #000000 #000000 #e0a040 #000000 #000000
