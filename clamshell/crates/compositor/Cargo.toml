[package]
name = "clamshell-compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "ClamShell's in-process compositor, developed nested on the desktop"

[dependencies]
clamshell-device.workspace = true
clamshell-state.workspace = true
clamshell-ui.workspace = true
smithay = { git = "https://github.com/robinei/smithay", rev = "1ca7f763c2667bcf4c3f0f9f9211664fabb0191b", default-features = false, features = ["backend_winit", "backend_drm", "backend_gbm", "backend_libinput", "backend_udev", "backend_session_libseat", "desktop", "wayland_frontend"] }
tiny-skia.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
xcursor = "0.3.11"
# SIGTERM and SIGINT read by the event loop (the same calloop as smithay's).
calloop = { version = "0.14", features = ["signals"] }
x11rb-protocol = { version = "0.13.2", features = ["res", "composite", "xfixes", "randr"] }
command-fds = "0.3.3"
rustix.workspace = true
wayland-client.workspace = true
winit-wayland = { version = "=0.31.0-beta.3", default-features = false }

[dev-dependencies]
clamshell-library = { workspace = true, features = ["demo"] }
x11rb = { version = "0.13.2", features = ["shape"] }
tempfile.workspace = true
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[lints]
workspace = true
