# The terminal (foot) in ClamShell's look: black, the bright text, Noto Sans Mono at a size readable on
# the Thor's 6" 1080p screen at scale 1 (about 21 px a line, some 150 columns), room at the edges.
# The colours are ClamShell's: its greys, the accent (amber), go (green) and Fn (blue), with red,
# magenta and cyan muted to sit beside them.
[main]
font=Noto Sans Mono:size=16
pad=16x12
# Selecting copies (to the clipboard, and the primary selection a right click pastes).
selection-target=both

[mouse-bindings]
# A right click pastes (the primary selection: the last text selected, or copied anywhere, as ClamShell
# copies the clipboard's text to it); foot has no clipboard paste on the mouse. The middle button too.
primary-paste=BTN_RIGHT BTN_MIDDLE
select-extend=none

# (foot 1.28: the colours are [colors-dark], the cursor's among them.)
[colors-dark]
cursor=000000 c8c8d0
background=000000
foreground=c8c8d0
selection-background=34343c
selection-foreground=c8c8d0
# black, red, green, yellow, blue, magenta, cyan, white
regular0=000000
regular1=c0605a
regular2=45a866
regular3=e0a040
regular4=5f82b8
regular5=a07ab8
regular6=5aa0a8
regular7=a4a4ae
bright0=5a5a64
bright1=d8807a
bright2=6cc088
bright3=ecbc6c
bright4=86a2cc
bright5=bc9ccf
bright6=80bcc2
bright7=c8c8d0
