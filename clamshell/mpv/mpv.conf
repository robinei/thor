# mpv on the Thor: the top screen (6", 1920x1080 OLED, SDR through sway), driven by the pad (input.conf).
# session.sh installs it as ~/.config/mpv/mpv.conf where there is none.

input-gamepad=yes
fullscreen=yes

# Where a video was left: ClamShell reads these for its progress bars and Play (by the file's name, so
# moved files keep their place).
save-position-on-quit=yes
write-filename-in-watch-later-config=yes
ignore-path-in-watch-later-config=yes
save-watch-history=yes

alang=jpn,jp,eng,en,enUS
sub-auto=fuzzy
sub-blur=1
sub-color="#FFD766"

vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk
hwdec=auto-safe
profile=high-quality

# SDR out: HDR tone-mapped down to the panel, SDR shown as it is; the OLED's black is black.
target-colorspace-hint=no
tone-mapping=bt.2446a
gamut-mapping-mode=perceptual
hdr-compute-peak=yes
target-contrast=inf

video-sync=display-resample
interpolation=no
dither-depth=auto
dither=fruit
deband=yes
deband-threshold=40
deband-iterations=6
deband-range=16
deband-grain=4
