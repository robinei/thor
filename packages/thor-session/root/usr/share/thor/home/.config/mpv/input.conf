# The pad in mpv, as in ClamShell: A plays, B goes back (quits; the place is kept). Back and Home are
# ClamShell's.

GAMEPAD_ACTION_DOWN cycle pause
GAMEPAD_ACTION_RIGHT quit
GAMEPAD_ACTION_LEFT cycle sub
GAMEPAD_ACTION_UP cycle audio
GAMEPAD_START show-progress

GAMEPAD_DPAD_LEFT seek -10
GAMEPAD_DPAD_RIGHT seek 10
GAMEPAD_DPAD_UP seek 60
GAMEPAD_DPAD_DOWN seek -60
GAMEPAD_LEFT_SHOULDER add chapter -1
GAMEPAD_RIGHT_SHOULDER add chapter 1
# (Once per press: mpv misses a trigger's release when it jumps to zero, and would repeat to the end.)
GAMEPAD_LEFT_TRIGGER nonrepeatable seek -5
GAMEPAD_RIGHT_TRIGGER nonrepeatable seek 5
