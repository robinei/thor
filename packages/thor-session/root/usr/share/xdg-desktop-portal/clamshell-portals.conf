# The portals for ClamShell's session (XDG_CURRENT_DESKTOP=ClamShell): ClamShell's file chooser, which
# picks in the Library (clamshell.portal), and GTK's for the rest of what apps ask of the desktop. GTK's
# file chooser takes over while ClamShell isn't there.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=clamshell;gtk
