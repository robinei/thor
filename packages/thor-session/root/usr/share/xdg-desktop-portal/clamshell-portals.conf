# The portals for ClamShell's session (XDG_CURRENT_DESKTOP=ClamShell): ClamShell's file chooser, which
# picks in the Library (clamshell.portal), and GTK's for the rest of what apps ask of the desktop.
# xdg-desktop-portal takes the first backend listed whose .portal file has the interface, whether it
# runs or not: while ClamShell is down, a file chooser fails, as nothing could show it anyway.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=clamshell
