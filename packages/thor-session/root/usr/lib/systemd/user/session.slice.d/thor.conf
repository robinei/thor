# The session's own units (ClamShell, PipeWire, udiskie) go ahead of apps and games (app.slice, weight
# 100) when both want the CPU, so the screens and the sound keep up under a game that takes every core.
# (No memory protection: MemoryLow= would need allocations on the system's slices above the user
# manager, and ClamShell's working set is small and in use.)
[Slice]
CPUWeight=400
