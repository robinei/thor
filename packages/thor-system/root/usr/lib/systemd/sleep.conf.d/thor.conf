# Suspend as s2idle, as Thorch and Armada settled on for the Thor (the kernel would pick deep where the
# firmware offers it); hibernate after 30 minutes asleep (systemd wakes the machine with the RTC alarm to
# do it), or earlier when the battery runs low. Deep sleep, to compare (PB-OS uses it on the Thor;
# linux-thor carries its 0505 and 0547 for it): /etc/systemd/sleep.conf.d/zz-deep.conf with
# "[Sleep]" and "MemorySleepMode=deep" (named to sort after this file: the last one sorted wins;
# docs/thor-gameplan.md, "If it happens").
[Sleep]
MemorySleepMode=s2idle
HibernateDelaySec=30min
