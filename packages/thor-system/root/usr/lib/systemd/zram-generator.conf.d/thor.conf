# Compressed swap in memory (zstd) before the swap file on the card, which is slow (about 13 MB/s) and
# stays for hibernating (systemd hibernates to the swap file, never to zram). Sizes as Armada's.
[zram0]
zram-size = min(ram, 16384)
zram-resident-limit = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
