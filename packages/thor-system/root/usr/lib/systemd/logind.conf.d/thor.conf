# The power button and the lid put the machine to sleep with logind's "sleep" action: the first that
# works of suspend-then-hibernate and suspend (so suspend still works while hibernate doesn't, e.g. before
# the swap file exists or on a card too small for it). ClamShell notices waking and applies its settings
# again. A long press of the power button powers off.
[Login]
SleepOperation=suspend-then-hibernate suspend
HandlePowerKey=sleep
HandlePowerKeyLongPress=poweroff
HandleLidSwitch=sleep
HandleLidSwitchExternalPower=sleep
