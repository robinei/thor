# Our initramfs (thor-boot): the root by label; all storage drivers, no autodetect; resume from
# hibernate. resume: after block, before filesystems; it resumes from resume= / resume_offset= on the
# command line. The SD card appears asynchronously, so thor-root-wait first waits up to 10 s for
# THOR_ROOT (the root's own rootwait comes only later, in filesystems).
MODULES=()
BINARIES=()
FILES=()
HOOKS=(base udev modconf block thor-root-wait resume filesystems fsck)
COMPRESSION=zstd
