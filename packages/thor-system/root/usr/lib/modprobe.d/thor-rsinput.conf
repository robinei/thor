# The sticks' full travel: the gamepad driver (rsinput) takes +-1408 by default, of which the sticks
# reach +-1024 (Thorch's axis-range, its dts-patches/0007), so games saw about 73 % of it. Its module
# parameters, read as it starts (Armada calibrates through the same ones). To check on the device: the
# stick's corners reach the axes' ends (evtest). And the MCU's joystick frame as AYN's Android sends it on
# the Thor, 10,4 (PB-OS found it in librsinput.so; the driver's own is 6,2, Armada's; linux-thor's
# thor-0002 makes it an option): PB-OS found the sticks coarse with another.
options rsinput mcu_frame=10,4 axis_leftx_min=-1024 axis_leftx_max=1024 axis_lefty_min=-1024 axis_lefty_max=1024 axis_rightx_min=-1024 axis_rightx_max=1024 axis_righty_min=-1024 axis_righty_max=1024
