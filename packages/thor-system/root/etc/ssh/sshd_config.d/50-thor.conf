# Remote login (ClamShell's Setup tab turns sshd on and off: thor-account). Only the session's user, never
# root directly; 3 password tries per connection, 30 s to log in. Passwords stay allowed: the account's
# (8 characters at least) is how a key gets added to ~/.ssh/authorized_keys in the first place.
PermitRootLogin no
AllowUsers thor
MaxAuthTries 3
LoginGraceTime 30
