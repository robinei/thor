# Remote login (ClamShell's Device view turns sshd on and off: thor-account). Only the session's user, never
# root directly; 3 password tries per connection, 30 s to log in. Passwords stay allowed: the account's
# (8 characters at least) is how a key gets added to ~/.ssh/authorized_keys in the first place. Your own
# settings go in a file of your own read before this one, such as 10-local.conf (sshd takes the first
# value it reads: PasswordAuthentication no there turns passwords off). An edit here is kept too, with
# the package's next version beside it as a .pacnew.
PermitRootLogin no
AllowUsers thor
MaxAuthTries 3
LoginGraceTime 30
